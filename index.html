<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TCB Status</title>
<meta name="description" content="Live status for The Cloud Bakery platform." />
<style>
  :root {
    --bg: #FAFAF8;
    --card: #FFFFFF;
    --ink: #1C1F1A;
    --ink-soft: #5A6156;
    --line: #E4E6E0;
    --ok: #1F7A4D;
    --ok-bg: #E5F3EA;
    --warn: #A6650C;
    --warn-bg: #FBF0DD;
    --down: #B0332A;
    --down-bg: #FBE8E6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14160F;
      --card: #1D2018;
      --ink: #ECEEE8;
      --ink-soft: #A6AC9E;
      --line: #2E3227;
      --ok: #6FCB98;
      --ok-bg: #16281E;
      --warn: #E4A93F;
      --warn-bg: #2E230F;
      --down: #E58179;
      --down-bg: #2E1613;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 56px 20px 80px; }
  header { margin-bottom: 32px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0; }

  .status-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 28px;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .dot.healthy { background: var(--ok); }
  .dot.degraded { background: var(--warn); }
  .dot.down, .dot.unhealthy { background: var(--down); }
  .dot.unknown { background: var(--ink-soft); }
  .status-text { font-size: 17px; font-weight: 600; }
  .status-meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); margin: 0 0 12px; }
  .incidents { display: flex; flex-direction: column; gap: 10px; }
  .incident {
    background: var(--card);
    border: 1px solid var(--line);
    border-left-width: 4px;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 14px;
  }
  .incident.down, .incident.unhealthy { border-left-color: var(--down); }
  .incident.degraded { border-left-color: var(--warn); }
  .incident-status { font-weight: 600; }
  .incident-time { color: var(--ink-soft); font-size: 12.5px; margin-top: 2px; }
  .incident-note { margin-top: 6px; color: var(--ink-soft); }
  .empty { color: var(--ink-soft); font-size: 14px; }

  footer { margin-top: 48px; font-size: 12.5px; color: var(--ink-soft); }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Cloud Bakery — Status</h1>
    <p class="sub">Automated checks every 5 minutes against the live platform.</p>
  </header>

  <div class="status-card">
    <div class="dot unknown" id="dot"></div>
    <div>
      <div class="status-text" id="status-text">Loading…</div>
      <div class="status-meta" id="status-meta"></div>
    </div>
  </div>

  <section>
    <h2>Incident history</h2>
    <div class="incidents" id="incidents">
      <p class="empty">Loading…</p>
    </div>
  </section>

  <footer>
    Hosted independently of the platform it monitors, so this page stays reachable during an outage.
    Source: <a href="https://github.com/MKmike02/tcb-status">github.com/MKmike02/tcb-status</a>
  </footer>
</div>

<script>
  const STATUS_LABEL = {
    healthy: 'All systems operational',
    degraded: 'Degraded performance',
    unhealthy: 'Service disruption',
    down: 'Service unavailable',
  };

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins === 1) return '1 minute ago';
    if (mins < 60) return mins + ' minutes ago';
    const hrs = Math.round(mins / 60);
    if (hrs === 1) return '1 hour ago';
    return hrs + ' hours ago';
  }

  fetch('status.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      const dot = document.getElementById('dot');
      const text = document.getElementById('status-text');
      const meta = document.getElementById('status-meta');
      const s = data.status || 'unknown';
      dot.className = 'dot ' + s;
      text.textContent = STATUS_LABEL[s] || 'Status unknown';
      meta.textContent = 'Last checked ' + timeAgo(data.checked_at);
    })
    .catch(() => {
      document.getElementById('status-text').textContent = 'Unable to load status';
    });

  fetch('incidents.json?_=' + Date.now())
    .then(r => r.json())
    .then(list => {
      const container = document.getElementById('incidents');
      if (!list.length) {
        container.innerHTML = '<p class="empty">No incidents recorded.</p>';
        return;
      }
      container.innerHTML = list.slice(0, 20).map(inc => {
        const dur = inc.resolved_at
          ? 'Resolved ' + timeAgo(inc.resolved_at)
          : 'Ongoing since ' + timeAgo(inc.started_at);
        return '<div class="incident ' + inc.status + '">' +
          '<div class="incident-status">' + (STATUS_LABEL[inc.status] || inc.status) + '</div>' +
          '<div class="incident-time">' + dur + '</div>' +
          (inc.note ? '<div class="incident-note">' + inc.note + '</div>' : '') +
          '</div>';
      }).join('');
    })
    .catch(() => {
      document.getElementById('incidents').innerHTML = '<p class="empty">Unable to load incident history.</p>';
    });
</script>
</body>
</html>
